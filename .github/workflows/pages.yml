name: Deploy website to GitHub Pages

# Publish manually in Actions, or explicitly update the deployment request file.
# Ordinary source/image uploads do not publish the website.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/pages-deploy-request']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed catalogue and admin routes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          const base = process.env.PAGE_URL;
          if (!base?.startsWith('https://')) throw new Error('No deployed Pages URL was returned.');
          async function check(path, expected) {
            let lastError;
            for (let attempt = 0; attempt < 8; attempt++) {
              try {
                const url = new URL(path, base);
                url.searchParams.set('release', process.env.GITHUB_SHA);
                const response = await fetch(url, { signal: AbortSignal.timeout(15000), cache: 'no-store' });
                const html = await response.text();
                if (!response.ok || !html.includes(expected)) throw new Error(`${url.pathname}: HTTP ${response.status}, expected content not ready`);
                console.log(`Verified ${url.pathname}: HTTP ${response.status}`);
                return html;
              } catch (error) { lastError = error; if (attempt < 7) await new Promise(resolve => setTimeout(resolve, 5000)); }
            }
            throw lastError;
          }
          const home = await check('./', 'id="root"');
          const asset = home.match(/<script[^>]*src="([^"]+)"/);
          if (!asset) throw new Error('The deployed application script is missing.');
          await check(asset[1], 'rehoming');
          await check('rehoming/', '#/rehoming');
          await check('admin/', '#/admin');
          await check('admin/social/', '#/admin/social');
          console.log('::notice::Live Pages checks passed: catalogue, admin, nested social route and main application asset.');
          JS
